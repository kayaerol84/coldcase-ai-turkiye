name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KB references point at existing files
        run: python3 scripts/check-kb.py
      - name: docker compose file is valid (all profiles)
        run: docker compose -f infra/docker/docker-compose.yml --profile s3 --profile embeddings config -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: coldcase
          POSTGRES_USER: coldcase
          POSTGRES_PASSWORD: coldcase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coldcase" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install OCR engine (Turkish) and fonts used by test fixtures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur fonts-dejavu-core
      - name: Start S3-compatible object store (same image and config as docker compose)
        working-directory: .
        run: |
          image=$(python3 -c "import yaml;print(yaml.safe_load(open('infra/docker/docker-compose.yml'))['services']['objectstore']['image'])")
          docker run -d --name objectstore -p 9000:8333 \
            -v "$PWD/infra/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            "$image" server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:9000 && break; sleep 2; done
          sleep 5 # filer and volume servers finish registering after the S3 port opens
      - run: ./gradlew test --no-daemon
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
      - name: S3 integration tests actually ran (not skipped)
        run: |
          f=build/test-results/test/TEST-tr.coldcase.api.S3ObjectStoreIntegrationTest.xml
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          grep -q 'tests="3" skipped="0" failures="0" errors="0"' "$f"
      - name: Object store logs
        if: failure()
        run: docker logs objectstore 2>&1 | tail -100

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
