name: Renovate config

on:
  pull_request:
    paths: ["renovate.json"]
  push:
    branches: [main]
    paths: ["renovate.json"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # Renovate 44 needs Node 24
      - name: Validate renovate.json
        run: npx --yes --package renovate@44.198.3 -- renovate-config-validator --strict
