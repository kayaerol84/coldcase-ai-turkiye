# Local development stack. Not for production use. All ports are bound to localhost only.
name: coldcase
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: coldcase
      POSTGRES_USER: coldcase
      POSTGRES_PASSWORD: coldcase
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldcase"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: coldcase
      MINIO_ROOT_PASSWORD: coldcase-dev-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm --http-port 8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["127.0.0.1:8180:8180"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]

  embeddings:
    # Self-hosted embedding server (Hugging Face Text Embeddings Inference) running BAAI/bge-m3.
    # Document text is sent here, so it must never be exposed beyond the backend network.
    # Image pinned by digest; upgrade deliberately. Pin the model too with EMBEDDINGS_MODEL_REVISION.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    command: >-
      --model-id BAAI/bge-m3
      --revision ${EMBEDDINGS_MODEL_REVISION:-main}
      --api-key ${EMBEDDINGS_API_KEY:-dev-embed-key}
      --auto-truncate
      --port 80
    ports: ["127.0.0.1:8082:80"]
    volumes: [hfcache:/data]

volumes:
  pgdata:
  miniodata:
  hfcache:
